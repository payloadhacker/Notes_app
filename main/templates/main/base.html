{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NoteApp{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="{% url 'home' %}" class="logo-link">
                 <span>NoteApp</span>
            </a>
        </div>

        <nav class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'addNote' %}">+ New Note</a>
                <a href="{% url 'home' %}">My Notes</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn-nav">Login</a>
               | <a href="{% url 'signup' %}" class="btn-nav">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <main class="page-container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>© 2025 <strong>NoteApp</strong> — Not Built for focus </p>
    </footer>
</body>
</html>
