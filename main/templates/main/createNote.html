{% extends 'main/base.html' %}
{% block content %}
<div class="form-card">
  <h2>Create New Note</h2>

  <form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn"> Save Note</button>
    <a href="{% url 'home' %}" class="btn" style="margin-left: 10px;">Cancel</a>
  </form>
</div>
{% endblock %}
