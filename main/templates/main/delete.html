{% extends 'main/base.html' %}
{% block content %}
<div class="form-card">
  <h2>Delete Note</h2>
  <p>Are you sure you want to permanently delete the note titled <strong>"{{ notes.title }}"</strong>?</p>

  <form method="post" style="margin-top: 20px;">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger"> Yes, Delete</button>
    <a href="{% url 'details' note.pk %}" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
