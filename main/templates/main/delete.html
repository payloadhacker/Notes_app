{% extends 'main/base.html' %}
{% block content %}
<div class="form-card">
  <h2>Delete Note</h2>
  <p>Are you sure you want to delete "{{ notes.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'home' %}" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
