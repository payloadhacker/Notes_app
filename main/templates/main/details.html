{% extends 'main/base.html' %}
{% block content %}
<div class="container">
  <div class="note-detail-container">
    <div class="note-detail note-{{ note.colored|default:'white' }}">
      <h2>{{ note.title }}</h2>
      <p>{{ note.content }}</p>

      <p><strong>Created:</strong> {{ note.created_at|date:"M d, Y H:i" }}</p>
      <p><strong>Last Updated:</strong> {{ note.updated_at|date:"M d, Y H:i" }}</p>

      {% if note.pinned %}
        <p>📌 <strong>Pinned Note</strong></p>
      {% endif %}

      <div style="margin-top: 20px;">
        <a href="{% url 'edit' note.pk %}" class="btn"> Edit</a>
        <a href="{% url 'delete' note.pk %}" class="btn btn-danger"> Delete</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
