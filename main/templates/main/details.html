{% extends 'main/base.html' %}
{% block content %}
<div class="container">
  <div class="note-detail-container">
    <div class="note-detail note-{{ note.colored|default:'white' }}">
      <h2>{{ note.title }}</h2>
      <p>{{ note.content }}</p>
      <p><strong>Created:</strong> {{ note.created_at }}</p>
      <p><strong>Last Updated:</strong> {{ note.updated_at }}</p>

      {% if note.pinned %}
        <p>📌 This note is pinned</p>
      {% endif %}

      <a href="{% url 'edit' note.pk %}" class="btn">Edit</a>
      <a href="{% url 'delete' note.pk %}" class="btn btn-danger">Delete</a>
    </div>
  </div>
</div>
{% endblock %}
