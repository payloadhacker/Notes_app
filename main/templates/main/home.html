{% extends 'main/base.html' %}
{% block content %}
<div class="container">
  <div class="header">
    <h1>Your Notes</h1>
    <a href="{% url 'create' %}" class="btn">+ New Note</a>
  </div>

  <div class="Notes">
    <ul>
      {% for note in notes %}
        <li class="note-{{ note.colored|default:'white' }}">
          <a href="{% url 'details' note.pk %}">
            {{ note.title }}
          </a>
        </li>
      {% empty %}
        <li>No notes yet.</li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
