{% extends 'main/base.html' %} 
{% load static %}

{% block content %}
<div class="container">
    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            <h2>Login to NoteApp</h2>

            {% if messages %}
                {% for message in messages %}
                    <p class="error">{{ message }}</p>
                {% endfor %}
            {% endif %}

            <div class="form-group">
                <label for="id_email">Email</label>
                <input type="email" name="email" id="id_email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="remember"> Remember Me
                </label>
            </div>

            <div class="form-group">
                <button type="submit" class="btn">Login</button>
            </div>

            <p class="subtext">Don’t have an account? <a href="{% url 'signup' %}">Sign up</a></p>
            <p class="subtext"><a href="#">Forgot password?</a></p>
        </form>
    </div>
</div>
{% endblock %}
